name: Upstream integration checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed merge
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Run frontend tests
        run: npm test -- --run
      - name: Run lint
        run: npm run lint
      - name: Build frontend
        run: npm run build

  windows-application:
    name: Windows application
    runs-on: windows-latest
    steps:
      - name: Check out proposed merge
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend for Rust context
        run: npm run build
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture
      - name: Build Tauri application
        run: npm run tauri -- build
