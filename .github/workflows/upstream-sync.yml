name: Sync upstream

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  SYNC_BRANCH: automation/upstream-sync
  UPSTREAM_REPOSITORY: tranxuanthang/lrcget

jobs:
  sync:
    name: Prepare upstream merge
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main

      - name: Detect upstream changes
        id: detect
        shell: bash
        run: |
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Fork main already contains upstream main."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare and push sync branch
        if: steps.detect.outputs.has_changes == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --force-create "$SYNC_BRANCH" origin/main
          if ! git merge --no-edit upstream/main; then
            echo "::error::Upstream merge conflicts require manual resolution."
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git push --force-with-lease origin "HEAD:$SYNC_BRANCH"

      - name: Open or update sync pull request
        if: steps.detect.outputs.has_changes == 'true'
        id: pull-request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list --base main --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "Sync upstream tranxuanthang/lrcget" \
              --body "Automated merge of upstream main into this fork. Required integration checks must pass before auto-merge. Conflicts or check failures require manual review.")"
            pr_number="${pr_url##*/}"
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          gh pr view "$pr_number" --json url,headRefOid

      - name: Dispatch integration checks
        if: steps.detect.outputs.has_changes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run upstream-integration.yml --ref "$SYNC_BRANCH"

      - name: Enable auto-merge for sync pull request
        if: steps.detect.outputs.has_changes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.pull-request.outputs.number }}" --auto --merge
